trigger:
- main

resources:
- repo: self

pool:
  vmImage: ubuntu-latest

variables:
  # tag: '$(Build.BuildId)'
  tag: 48

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    steps:
    # - task: Docker@2
    #   displayName: Build an image
    #   inputs:
    #     command: build
    #     dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
    #     tags: |
    #       $(tag)
    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: '**/*.yaml'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'manifests'
        publishLocation: 'Container'

- stage: Deploy
  displayName: Configure Cluster
  jobs: 
  - job: Deploy
    displayName: Deploy
    steps: 
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'manifests'
        itemPattern: '**/*.yaml'
        targetPath: '$(System.ArtifactsDirectory)'
    - task: Kubernetes@1
      displayName: 'Deploy using kubectl'
      inputs:
       connectionType: 'kubernetesServiceConnection'
       kubernetesServiceEndpoint: 'aws-kubernetes-cluster-service-connection'
       namespace: 'default'
       command: apply
       arguments: '--validate=false -f $(System.ArtifactsDirectory)/configuration/kubernetes'