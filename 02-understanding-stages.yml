# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  jobs:
  - job: FirstJob
    steps:
    - bash: echo build / FirstJob
    - bash: echo $(PipelineLevelVariable)

  - job: SecondJob
    steps:
    - bash: echo build / SecondJob

- stage: DevDeploy
  dependsOn: Build
  variables:
    enviroment: DevDeploy
  jobs:
  - job: FirstJob
    steps:
    - bash: echo $(enviroment) / FirstJob

- stage: QADeploy
  dependsOn: Build
  variables:
    enviroment: QADeploy
  jobs:
  - job: FirstJob
    steps:
    - bash: echo $(enviroment) / FirstJob

- stage: ProdDeploy
  dependsOn:
  - DevDeploy
  - QADeploy
  variables:
    enviroment: DevDeploy
  jobs:
  - job: FirstJob
    steps:
    - bash: echo $(enviroment) / FirstJob
