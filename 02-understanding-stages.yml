trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  jobs:
  - job: FirstJob
    steps:
    - bash: echo build / FirstJob

  - job: SecondJob
    steps:
    - bash: echo build / SecondJob

- stage: DevDeploy
  jobs:
  - job: FirstJob
    steps:
    - bash: echo Dev / FirstJob

- stage: QADeploy
  jobs:
  - job: FirstJob
    steps:
    - bash: echo QADeploy / FirstJob

- stage: ProdDeploy
  jobs:
  - job: FirstJob
    steps:
    - bash: echo ProdDeploy / FirstJob
